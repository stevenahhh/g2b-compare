name: Release Tauri desktop

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Verify release tag
        shell: pwsh
        run: |
          $config = Get-Content .\desktop\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "app-v$($config.version)"
          if ("${{ github.ref_name }}" -cne $expected) {
            throw "Release tag must be $expected"
          }

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Run frontend gates
        working-directory: desktop
        run: |
          npm run check
          npm test

      - name: Run Rust gates
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked

      - name: Build signed updater and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          owner: stevenahhh
          repo: g2b-compare-releases
          releaseCommitish: main
          tagName: app-v__VERSION__
          releaseName: G2B Compare Desktop v__VERSION__
          releaseBody: |
            서명된 Windows NSIS 설치 파일과 자동 업데이트 메타데이터입니다.
            초안 검토 후 게시하면 설치된 앱에서 업데이트를 감지합니다.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
