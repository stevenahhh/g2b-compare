{% extends "base.html" %}
{% block content %}
<section class="search-panel" aria-labelledby="search-title">
  <p class="eyebrow">물품 탐색</p>
  <h1 id="search-title">유사물품 검색</h1>
  <form id="search-form" method="get" action="/">
    <label>물품명<input name="product_name" required maxlength="100" value="{{ form.product_name|default('') }}"{% if field_error %} aria-invalid="true" aria-describedby="product-name-error"{% endif %}></label>
    {% if field_error %}<p class="field-error" id="product-name-error">{{ field_error }}</p>{% endif %}
    <label>규격 및 조건<textarea name="spec_text" maxlength="500">{{ form.spec_text|default('') }}</textarea></label>
    <div class="form-row">
      <label>목표가격(원)<input name="target_price_won" inputmode="numeric" value="{{ form.target_price_won|default('') }}"></label>
      <label>단위<input name="price_unit" value="{{ form.price_unit|default('') }}"></label>
    </div>
    <div class="form-row">
      <label>허용범위(%)<input name="price_tolerance_pct" inputmode="decimal" value="{{ form.price_tolerance_pct|default('') }}"></label>
      <label>대분류 코드<input name="category_code" value="{{ form.category_code|default('') }}"></label>
    </div>
    <label>세부분류 코드<input name="detail_category_code" value="{{ form.detail_category_code|default('') }}"></label>
    <button type="submit">검색</button>
  </form>
</section>
<section id="results-region" class="results-panel" aria-live="polite">
  {% include "results.html" %}
</section>
{% endblock %}
